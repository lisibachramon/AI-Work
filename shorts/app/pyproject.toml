[project]
name = "shorts"
version = "0.1.0"
description = "Viral commentary YouTube Shorts pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "google-api-python-client>=2.149",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
    "yt-dlp>=2024.10.7",
    "plexapi>=4.16",
    "anthropic>=0.40",
    "python-slugify>=8.0",
    "structlog>=24.4",
    "typer>=0.13",
    "jinja2>=3.1",
    "pillow>=11.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
tts = [
    # XTTS-v2 — DE/EN/ES/HI multilingual. Heavy; install in the Docker image
    # only. Pin TTS to a release that builds on Python 3.12.
    "TTS>=0.22.0; python_version < '3.13'",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
shorts-worker = "shorts.jobs.worker:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shorts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = [
    # sync pathlib calls inside async funcs are fine for our short ops
    "ASYNC240",
]
