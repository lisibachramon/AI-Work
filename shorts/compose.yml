# Local dev compose. Postgres only; run the API on the host with `uv run` for
# fast iteration. The prod compose lives under deploy/.

name: shorts-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shorts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shorts}
      POSTGRES_DB: ${POSTGRES_DB:-shorts}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - shorts-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shorts} -d ${POSTGRES_DB:-shorts}"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  shorts-dev-postgres:
