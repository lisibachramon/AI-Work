name: kitchen

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_TEXT_MODEL: ${OLLAMA_TEXT_MODEL}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_VISION_MODEL: ${ANTHROPIC_VISION_MODEL}
      ANTHROPIC_RECIPE_MODEL: ${ANTHROPIC_RECIPE_MODEL}
      ANTHROPIC_PLAN_MODEL: ${ANTHROPIC_PLAN_MODEL}
      ANTHROPIC_FALLBACK_MODEL: ${ANTHROPIC_FALLBACK_MODEL}
      WHISPER_BASE_URL: ${WHISPER_BASE_URL}
      WHISPER_MODEL: ${WHISPER_MODEL}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE}
      VIDEO_MAX_VISION_CALLS_PER_SESSION: ${VIDEO_MAX_VISION_CALLS_PER_SESSION}
    volumes:
      - ./data/uploads:/app/data/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "8081"

  whisper:
    build:
      context: services/whisper
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL}
    volumes:
      - whisper-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    expose:
      - "9000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/backups:/backups
      - ./data/uploads:/uploads:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache rsync >/dev/null 2>&1 || true
        while true; do
          ts=$$(date +%Y%m%d-%H%M%S)
          mkdir -p /backups/db /backups/uploads
          PGPASSWORD=$$POSTGRES_PASSWORD pg_dump -h postgres -U $$POSTGRES_USER $$POSTGRES_DB \
            > /backups/db/dump-$$ts.sql && \
            ls -t /backups/db/dump-*.sql | tail -n +8 | xargs -r rm -f
          rsync -a --delete /uploads/ /backups/uploads/
          sleep 86400
        done

volumes:
  postgres-data:
  whisper-models:
  caddy-data:
  caddy-config:
