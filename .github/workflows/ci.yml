name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Build shared
        run: pnpm --filter @kitchen/shared build

      - name: Build db
        run: pnpm --filter @kitchen/db build

      - name: Build api
        run: pnpm --filter @kitchen/api build

      - name: Build mcp
        run: pnpm --filter @kitchen/mcp build

      - name: Build web
        run: pnpm --filter @kitchen/web build

      - name: Test shared
        run: pnpm --filter @kitchen/shared test
