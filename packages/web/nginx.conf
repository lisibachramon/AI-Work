# Single public origin: this nginx serves the SPA AND reverse-proxies
# /api, /auth, /health, /mcp to the api container on the internal docker
# network. The public TLS-terminating proxy (jwilder/nginx-proxy) sees
# this nginx as a single backend.

upstream kitchen_api {
  server api:8080;
  keepalive 16;
}

server {
  listen 8081;
  server_name _;
  root /usr/share/nginx/html;

  client_max_body_size 25M;

  # SPA fallback — SvelteKit static adapter writes index.html as the fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long-cache hashed assets.
  location /_app/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # API proxy block. The jwilder front-proxy sets X-Forwarded-* already;
  # we just forward them on so Fastify (trustProxy: true) sees the original.
  location ~ ^/(api|auth|health|mcp)(/|$) {
    proxy_pass http://kitchen_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
}
